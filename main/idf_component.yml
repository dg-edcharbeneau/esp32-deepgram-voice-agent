## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.5'
  espressif/esp_websocket_client: '^1.5.0'
  waveshare/esp32_s3_touch_amoled_1_75c:
    version: "^3.0.0"
  # LVGL is only a *private* dependency of the BSP and of esp_lvgl_adapter, so
  # its include path is not inherited -- main has to ask for it itself.
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  # FFT for the spectrum display; the version spec_analyzer_radial proved.
  #
  # Pinned to exactly 1.8.0 twice now, both times to satisfy espressif/esp-sr:
  # EVERY published esp-sr version pins esp-dsp exactly and none is >= 1.8.2, so
  # the two are unsatisfiable together and the solver rejects the whole graph.
  # esp-sr is gone again, so this is free to float. See docs/notes/echo-cancellation.md.
  espressif/esp-dsp: "^1.8.2"

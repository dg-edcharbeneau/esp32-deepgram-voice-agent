## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.5'
  espressif/esp_websocket_client: '^1.5.0'
  waveshare/esp32_s3_touch_amoled_1_75c:
    version: "^3.0.0"
  # LVGL is only a *private* dependency of the BSP and of esp_lvgl_adapter, so
  # its include path is not inherited -- main has to ask for it itself.
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  # FFT for the spectrum display, PINNED EXACTLY, and not by preference.
  #
  # EVERY published esp-sr version pins esp-dsp to an exact version, and none of
  # them is >= 1.8.2. The newest (2.5.1) requires exactly 1.8.0, so "^1.8.2" and
  # esp-sr are unsatisfiable together -- the solver rejects the whole graph
  # rather than choosing, and it does so at reconfigure, before any code runs.
  #
  # Downgrading is safe and proven twice (9af05bc, c477a1b). Only
  # main/face_spectrum.c touches esp-dsp, through dsps_fft2r_fc32,
  # dsps_bit_rev_fc32, dsps_fft2r_init_fc32, dsps_wind_hann_f32 and
  # dsps_mul_f32 -- verified still the complete list, and long-stable APIs
  # unchanged across these releases. See docs/notes/echo-cancellation.md.
  espressif/esp-dsp: "1.8.0"
  # Echo cancellation. NOT the AFE -- a4fa137 measured the AFE at ~70 kB of
  # internal RAM and it does not fit; the STANDALONE AEC (esp_aec.h) is a
  # different object with a different price. Compiled in always, but only
  # instantiated under CONFIG_AEC_ENABLE, which is default off.
  espressif/esp-sr: "^2.1.0"

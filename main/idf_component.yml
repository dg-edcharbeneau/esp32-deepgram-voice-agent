## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.5'
  espressif/esp_websocket_client: '^1.5.0'
  waveshare/esp32_s3_touch_amoled_1_75c:
    version: "^3.0.0"
  # LVGL is only a *private* dependency of the BSP and of esp_lvgl_adapter, so
  # its include path is not inherited -- main has to ask for it itself.
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  # FFT for the spectrum display; the version spec_analyzer_radial proved.
  #
  # Was briefly pinned to exactly 1.8.0 to satisfy espressif/esp-sr, which is no
  # longer a dependency: its AFE needs ~70 kB of internal RAM and does not fit
  # alongside the display. See commit a4fa137.
  espressif/esp-dsp: "^1.8.2"

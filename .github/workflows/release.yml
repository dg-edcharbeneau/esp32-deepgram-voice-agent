name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and draft a release for"
        required: true

permissions:
  contents: write

jobs:
  build:
    # One board per IDF target (docs/boards.md). Each board builds in its own
    # job; `publish` attaches them all to one release, or none if either fails.
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      matrix:
        include:
          # The S3 keeps the asset names every earlier release used, which the
          # README and docs/index.html link to. The P4 is suffixed.
          - target: esp32s3
            suffix: ""
          - target: esp32p4
            suffix: "-esp32p4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # A COMMITTED sdkconfig would carry a menuconfig-seeded API key into the
      # published image. It is gitignored, so this should never fire -- which is
      # exactly why it is cheap to assert before publishing a binary.
      #
      # This has to run BEFORE the build, on the checkout as it came out of git:
      # idf.py generates a sdkconfig from sdkconfig.defaults, so afterwards the
      # file always exists and says nothing about what was committed.
      - name: Refuse to publish a seeded build
        shell: bash
        run: |
          if [ -f sdkconfig ]; then
            echo "A sdkconfig is committed -- it may contain an API key or Wi-Fi" >&2
            echo "password. Refusing to publish. See SECURITY.md." >&2
            exit 1
          fi

      # Same tracked-defaults-only build as CI: the published image carries no
      # API key and no network, so it boots into the provisioning portal.
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      # One image at offset 0 -- bootloader, partition table and app together --
      # so flashing needs no knowledge of this project's custom partitions.csv,
      # nor of where each chip keeps its bootloader (0x0 on the S3, 0x2000 on
      # the P4). merge-bin writes into build/, not the working directory.
      - name: Merge into a single flashable image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py merge-bin -o merged.bin
          mkdir dist
          mv build/merged.bin dist/deepgram_agent${{ matrix.suffix }}-merged.bin
          cp build/deepgram_agent.bin dist/deepgram_agent${{ matrix.suffix }}.bin
          cp build/deepgram_agent.elf dist/deepgram_agent${{ matrix.suffix }}.elf
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: attach firmware to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Release notes
        shell: bash
        run: |
          cat > NOTES.md <<'NOTES'
          Firmware for two Waveshare boards. Each `-merged.bin` is a single
          image containing the bootloader, partition table and app. It is built
          from this repo's tracked defaults, so it holds **no API key and no
          Wi-Fi network**: on first boot it raises its own WPA2 access point and
          shows the SSID and passphrase on the panel. Join it, and the captive
          portal asks for your network and your Deepgram API key.

          | Board | First install | Upgrade |
          |---|---|---|
          | ESP32-S3-Touch-AMOLED-1.75C | `deepgram_agent-merged.bin` | `deepgram_agent.bin` |
          | ESP32-P4-WIFI6-Touch-LCD-3.4C | `deepgram_agent-esp32p4-merged.bin` | `deepgram_agent-esp32p4.bin` |

          Flash with [esptool](https://github.com/espressif/esptool)
          (`pip install esptool`), with the board in download mode. On the S3:

          ```
          esptool.py -c esp32s3 -p /dev/YOUR-PORT write_flash 0x0 deepgram_agent-merged.bin
          ```

          On the P4:

          ```
          esptool.py -c esp32p4 -p /dev/YOUR-PORT write_flash 0x0 deepgram_agent-esp32p4-merged.bin
          ```

          **The P4 image runs on P4 chip revision v1.x only**, which is what
          the 3.4C boards have shipped with so far. `esptool.py -c esp32p4 -p
          /dev/YOUR-PORT chip_id` prints the revision; a v3.x board needs its
          own build. See `docs/boards.md`.

          **Upgrading from an earlier release?** Flash only the app, which keeps
          your Wi-Fi network, API key and settings (use `-c esp32p4` and
          `deepgram_agent-esp32p4.bin` on the P4):

          ```
          esptool.py -c esp32s3 -p /dev/YOUR-PORT write_flash 0x10000 deepgram_agent.bin
          ```

          The merged images are for a first install; they erase saved
          settings.

          The `.elf` files are attached for decoding a backtrace with
          `idf.py monitor` or `addr2line`; they are not needed to run the
          firmware.
          NOTES

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: NOTES.md
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            dist/deepgram_agent-merged.bin
            dist/deepgram_agent.bin
            dist/deepgram_agent.elf
            dist/deepgram_agent-esp32p4-merged.bin
            dist/deepgram_agent-esp32p4.bin
            dist/deepgram_agent-esp32p4.elf
          fail_on_unmatched_files: true
